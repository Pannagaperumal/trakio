; Trakio Round — Waveshare ESP32-C6-Touch-AMOLED-1.43
;
;   pio run                    build
;   pio run -t upload          flash (USB-C; hold BOOT while plugging in if the port doesn't appear)
;   pio device monitor         serial log, 115200
;
; The C6 needs arduino-esp32 3.x, which comes from the pioarduino platform
; (the stock PlatformIO espressif32 platform stops at core 2.x).

[env:trakio_round]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 160000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
  lvgl/lvgl@8.3.11
  bblanchon/ArduinoJson@7.4.2
  lewisxhe/SensorLib@0.3.1

build_flags =
  -Os
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -Isrc
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=3
